function spawn(p,n,spread,up){for(var i=0;i<n;i++){var q=P.find(function(a){return a.l<=0});if(!q)return;

  q.v.set((Math.random()-.5)*.2,up*(.05+Math.random()*.15),(Math.random()-.5)*.2)}}

  pp.needsUpdate=true;pc.needsUpdate=true}
function onSelect(){
  if(!reticle.visible)return;

    setHint("Tap the floor to send her there. Walk close and she gets shy.");return}

}
function react(now){
  if(target||now-lastReact<3)return;
  var dx=Z.position.x-cam.x,dz=Z.position.z-cam.z,dc=Math.hypot(dx,dz)||.01;
  if(dc<.55){var a=Math.atan2(dz,dx)+(Math.random()-.5)*1.2;target=new THREE.Vector3(cam.x+Math.cos(a)*1.4,Z.position.y,cam.z+Math.sin(a)*1.4);}

      else{var s=Math.min(d,.75*dt);Z.position.x+=dx/d*s;Z.position.z+=dz/d*s;lift=Math.sin(Math.PI*Math.min(1,1-d/d0))*Math.min(.12,d0*.25)}}

    Z.scale.setScalar(SC);

function end(){hitSource=null;session=null;hud.style.display="none";$("intro").style.display="flex";placed=false;target=null;Z.visible=shadow.visible=false;renderer.setAnimationLoop(null)}
$("go").onclick=function(){
  msg.textContent="";
  if(!navigator.xr){msg.textContent="This browser can’t do AR. Open this page in Chrome on Android.";return}
  navigator.xr.isSessionSupported("immersive-ar").then(function(ok){
    if(!ok){msg.textContent="AR isn’t available. Your phone needs “Google Play Services for AR” (free in Play Store). Then reload.";return}
    if(!renderer)init();

    return navigator.xr.requestSession("immersive-ar",{requiredFeatures:["hit-test"],optionalFeatures:["dom-overlay"],domOverlay:{root:hud}}).then(function(s){

};
