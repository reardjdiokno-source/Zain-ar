<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1020">
<title>Zain AR</title>
<style>
:root{--ink:#fff7fb;--rose:#ffb8d2;--gold:#f1cf85;--night:#1b1020;--glass:rgba(27,16,32,.55);--line:rgba(255,255,255,.22)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);overflow:hidden;overscroll-behavior:none;
 font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 20%,#4a2b5c,#1b1020)}
#cam,#bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
#zwrap{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
#shadow{position:absolute;left:-90px;top:-14px;width:180px;height:28px;border-radius:50%;
 background:radial-gradient(closest-side,rgba(0,0,0,.38),rgba(0,0,0,0));transform-origin:50% 50%}
#zrig{position:absolute;left:0;top:0;transform-origin:50% 96%}
#zrig img{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;user-select:none;-webkit-user-drag:none}
#zback{transform-origin:50% 40%}
#zain{-webkit-mask-image:linear-gradient(to right,transparent 24%,#000 30%,#000 70%,transparent 76%),linear-gradient(to bottom,transparent 61%,#000 66%);mask-image:linear-gradient(to right,transparent 24%,#000 30%,#000 70%,transparent 76%),linear-gradient(to bottom,transparent 61%,#000 66%)}
@keyframes hover{0%,100%{translate:0 0}50%{translate:0 -9px}}
@media (prefers-reduced-motion:reduce){#zain{animation:none}}
#sparks{position:absolute;inset:0;pointer-events:none}
#ui{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:none;
 justify-content:center;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--glass);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
 width:52px;height:52px;border-radius:26px;font-size:21px;display:grid;place-items:center;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.93)}
.btn.main{width:70px;height:70px;border-radius:35px;background:linear-gradient(160deg,#ffd3e4,#ffb8d2);color:#4a2b5c;border:3px solid #fff;font-size:26px}
#top{position:fixed;left:0;right:0;top:0;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 0;display:none;justify-content:space-between;align-items:center;pointer-events:none}
#top>*{pointer-events:auto}
#tag{font-size:15px;letter-spacing:.04em;padding:8px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#tip{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:9px 16px;border-radius:18px;font-size:14px;
 background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);text-align:center;max-width:88vw;transition:opacity .6s;display:none}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
 padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
 background:radial-gradient(120% 90% at 50% 15%,#5b3470,#1b1020 70%);z-index:5}
#intro img{height:44vh;max-height:380px;object-fit:contain;filter:drop-shadow(0 10px 26px rgba(255,160,205,.45));animation:hover 3.6s ease-in-out infinite}
#intro h1{margin:4px 0 0;font:600 40px/1 Georgia,"Times New Roman",serif;letter-spacing:.02em;color:#ffe3ee}
#intro p{margin:0;max-width:30ch;font-size:15px;line-height:1.5;color:#e9d6ea}
.go{appearance:none;border:0;border-radius:30px;padding:16px 30px;font:600 17px/1 inherit;font-family:inherit;color:#4a2b5c;
 background:linear-gradient(160deg,#ffe2ee,#ffb8d2);box-shadow:0 8px 24px rgba(255,150,200,.35);cursor:pointer;min-width:230px}
.go.alt{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:13px 24px;font-size:15px;font-weight:500}
#msg{min-height:20px;font-size:13px;color:var(--gold);max-width:34ch}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
#shot{position:fixed;inset:0;background:rgba(10,5,14,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:6;
 padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#shot img{max-width:100%;max-height:70vh;border-radius:14px;border:1px solid var(--line)}
#shot .row{display:flex;gap:10px}
</style>
</head>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id)};
var stage=$("stage"),cam=$("cam"),bgimg=$("bgimg"),zwrap=$("zwrap"),zain=$("zain"),sparks=$("sparks");
var facing="environment",stream=null,mode="none",mirrorBg=false,flip=1,sparkOn=true;
var S={x:0,y:0,s:1,r:0};
var AR=750/822; // image width/height

function baseH(){return Math.min(innerHeight*0.34,innerWidth/AR*0.6)}
function depth(){return 0.62+0.5*Math.min(1,Math.max(0,S.y/innerHeight))}
var V={lift:0,wk:1,sx:1,lean:0},LF="drop-shadow(0 6px 14px rgba(255,160,205,.35))";
var flyA=null,spinStart=0,ph=0,lastT=0,tapRec=null,zrig=$("zrig"),zback=$("zback");
zback.src=zain.src;$("introImg").src=zain.src;
function apply(){
  var h=baseH()*S.s*depth(),w=h*AR;
  V.lift=h*0.045+Math.sin(performance.now()/450)*h*0.012;
  zwrap.style.transform="translate("+S.x+"px,"+S.y+"px) rotate("+S.r+"deg)";
  zrig.style.width=w+"px";zrig.style.height=h+"px";zrig.style.left=(-w/2)+"px";zrig.style.top=(-h*0.96-V.lift)+"px";
  zrig.style.transform="rotate("+V.lean+"deg) scale("+(flip*V.sx)+",1)";zrig.style.filter=LF;
  zback.style.transform="scaleX("+V.wk+")";
  var sh=$("shadow");sh.style.width=w*0.6+"px";sh.style.left=(-w*0.3)+"px";
}
function burst(x,y,n){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=.6+Math.random()*1.6;
  dots.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,l:0,m:55+Math.random()*40,z:2+Math.random()*3})}}
function step(){
  var now=performance.now(),dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;var mv=false;
  if(flyA){var k=(now-flyA.t)/flyA.d;mv=true;
    if(k>=1){S.x=flyA.x1;S.y=flyA.y1;flyA=null;mv=false;V.lean=0}
    else{var e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      S.x=flyA.x0+(flyA.x1-flyA.x0)*e;S.y=flyA.y0+(flyA.y1-flyA.y0)*e-Math.sin(Math.PI*k)*flyA.arc;
      V.lean=(flyA.x1>flyA.x0?1:-1)*7*Math.sin(Math.PI*k)}}
  ph+=dt*(mv?16:(spinStart?11:5));
  V.wk=1-(mv?.2:.08)*(.5+.5*Math.sin(ph));
  if(spinStart){var q=(now-spinStart)/900;if(q>=1){spinStart=0;V.sx=1}else V.sx=Math.cos(q*Math.PI*2)}
  if(mv&&sparkOn&&dots.length<120&&Math.random()<.8){var h=baseH()*S.s*depth();
    dots.push({x:S.x+(Math.random()-.5)*24,y:S.y-h*(.15+Math.random()*.5),vx:(Math.random()-.5)*.6,vy:.2+Math.random()*.4,l:0,m:50,z:2+Math.random()*2.5})}
  apply();
}
function tap(x,y){
  var h=baseH()*S.s*depth(),w=h*AR;
  if(Math.abs(x-S.x)<w*.35&&y<S.y&&y>S.y-h){spinStart=performance.now();burst(S.x,S.y-h*.5,30);return}
  var d=Math.hypot(x-S.x,y-S.y),ty=Math.min(y,innerHeight*.93);
  flyA={t:performance.now(),d:Math.max(600,Math.min(1700,d*2.4)),x0:S.x,y0:S.y,x1:x,y1:ty,arc:Math.min(70,d*.18)};
}
function matchLight(){try{var c=document.createElement("canvas");c.width=c.height=8;var x=c.getContext("2d");x.drawImage(bgimg,0,0,8,8);

  LF="brightness("+(0.72+L*0.45).toFixed(2)+") saturate("+(0.88+L*0.25).toFixed(2)+")"}catch(_){}}
function drawZain(x,w,h,dpr){
  var W=Math.max(2,Math.round(w)),H=Math.max(2,Math.round(h));
  var a=document.createElement("canvas");a.width=W;a.height=H;var ac=a.getContext("2d");
  ac.save();ac.translate(W/2,H*.4);ac.scale(V.wk,1);ac.translate(-W/2,-H*.4);ac.drawImage(zback,0,0,W,H);ac.restore();
  var m=document.createElement("canvas");m.width=W;m.height=H;var mc=m.getContext("2d");
  var g1=mc.createLinearGradient(0,0,W,0);g1.addColorStop(.24,"rgba(0,0,0,0)");g1.addColorStop(.3,"#000");g1.addColorStop(.7,"#000");g1.addColorStop(.76,"rgba(0,0,0,0)");
  mc.fillStyle=g1;mc.fillRect(0,0,W,H);
  var g2=mc.createLinearGradient(0,0,0,H);g2.addColorStop(.61,"rgba(0,0,0,0)");g2.addColorStop(.66,"#000");mc.fillStyle=g2;mc.fillRect(0,0,W,H);
  var b=document.createElement("canvas");b.width=W;b.height=H;var bc=b.getContext("2d");
  bc.drawImage(zain,0,0,W,H);bc.globalCompositeOperation="destination-in";bc.drawImage(m,0,0);
  ac.drawImage(b,0,0);
  if(LF.indexOf("brightness")===0&&"filter" in x)x.filter=LF;
  x.drawImage(a,-w/2,-h*.96-V.lift*dpr,w,h);x.filter="none";
}
function reset(){flyA=null;S.x=innerWidth/2;S.y=innerHeight*0.78;S.s=1;S.r=0;flip=1;apply()}
function tip(t,ms){var e=$("tip");e.textContent=t;e.style.display="block";e.style.opacity=1;
  clearTimeout(tip.t);tip.t=setTimeout(function(){e.style.opacity=0;setTimeout(function(){e.style.display="none"},600)},ms||3500)}
function say(t){$("msg").textContent=t||""}

/* ---------- camera ---------- */
function stopStream(){if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}}
function startCamera(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    say("This page can’t open the camera here. Use “Use a photo instead”, or open the file in Chrome.");return Promise.resolve(false)}
  stopStream();
  return navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}}})
  .then(function(s){
    stream=s;cam.srcObject=s;cam.style.display="block";bgimg.style.display="none";mode="cam";
    mirrorBg=(facing==="user");cam.style.transform=mirrorBg?"scaleX(-1)":"none";
    return cam.play().catch(function(){}).then(function(){return true});
  }).catch(function(e){
    var n=e&&e.name;
    say(n==="NotAllowedError"||n==="SecurityError"?"Live camera is blocked in this view. Tap “Take a photo with camera app” instead.":
        n==="NotFoundError"?"No camera found. Use a photo instead.":"Camera didn’t start. Use a photo instead.");
    return false});
}
function enterApp(){
  $("intro").style.display="none";$("top").style.display="flex";$("ui").style.display="flex";
  reset();tip("Tap to make her fly · tap her to twirl · pinch to resize",4800);
}
$("bStart").onclick=function(){say("Starting camera…");startCamera().then(function(ok){if(ok){say("");enterApp()}})};
$("bStartPhoto").onclick=function(){$("fileCam").click()};
$("bPick").onclick=function(){$("file").click()};
$("bPhoto").onclick=function(){$("fileCam").click()};
function onPick(){
  var f=this.files&&this.files[0];if(!f)return;
  var u=URL.createObjectURL(f);
  bgimg.onload=function(){matchLight();stopStream();cam.style.display="none";bgimg.style.display="block";mode="photo";mirrorBg=false;
    if($("intro").style.display!=="none")enterApp();else tip("Photo set as background",2200)};
  bgimg.src=u;this.value="";
}
$("file").onchange=onPick;$("fileCam").onchange=onPick;
$("bFlip").onclick=function(){
  if(mode!=="cam"){$("file").click();return}
  facing=facing==="environment"?"user":"environment";
  startCamera().then(function(ok){if(!ok){facing=facing==="environment"?"user":"environment";tip("Couldn’t switch camera",2500)}});
};
$("bMirror").onclick=function(){flip=-flip;apply()};
$("bReset").onclick=reset;
$("bSpark").onclick=function(){sparkOn=!sparkOn;tip(sparkOn?"Sparkles on":"Sparkles off",1400)};

/* ---------- gestures (pointer events) ---------- */
var P={};var g=null;
function pts(){return Object.keys(P).map(function(k){return P[k]})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function ang(a,b){return Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI}
stage.addEventListener("pointerdown",function(e){
  try{stage.setPointerCapture(e.pointerId)}catch(_){}
  if(!Object.keys(P).length)tapRec={x:e.clientX,y:e.clientY,t:performance.now(),m:false};else if(tapRec)tapRec.m=true;flyA=null;
  P[e.pointerId]={x:e.clientX,y:e.clientY};init();e.preventDefault()},{passive:false});
stage.addEventListener("pointermove",function(e){
  if(!P[e.pointerId])return;P[e.pointerId]={x:e.clientX,y:e.clientY};if(tapRec&&Math.hypot(e.clientX-tapRec.x,e.clientY-tapRec.y)>10)tapRec.m=true;
  var p=pts();
  if(p.length===1&&g&&g.k===1){S.x=g.x+(p[0].x-g.px);S.y=g.y+(p[0].y-g.py)}
  else if(p.length>=2&&g&&g.k===2){
    var d=dist(p[0],p[1]);S.s=Math.min(4,Math.max(.15,g.s*d/g.d));
    S.r=g.r+(ang(p[0],p[1])-g.a);
    var cx=(p[0].x+p[1].x)/2,cy=(p[0].y+p[1].y)/2;S.x=g.x+(cx-g.cx);S.y=g.y+(cy-g.cy)}
  apply();e.preventDefault()},{passive:false});
function up(e){var was=Object.keys(P).length;delete P[e.pointerId];init();
  if(e.type==="pointerup"&&was===1&&tapRec&&!tapRec.m&&performance.now()-tapRec.t<400&&$("intro").style.display==="none")tap(e.clientX,e.clientY);
  if(!Object.keys(P).length)tapRec=null}
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
function init(){var p=pts();
  if(p.length===1)g={k:1,x:S.x,y:S.y,px:p[0].x,py:p[0].y};
  else if(p.length>=2)g={k:2,x:S.x,y:S.y,s:S.s,r:S.r,d:dist(p[0],p[1])||1,a:ang(p[0],p[1]),cx:(p[0].x+p[1].x)/2,cy:(p[0].y+p[1].y)/2};
  else g=null}
stage.addEventListener("wheel",function(e){S.s=Math.min(4,Math.max(.15,S.s*(e.deltaY<0?1.06:.94)));apply();e.preventDefault()},{passive:false});
["gesturestart","gesturechange","dblclick"].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},{passive:false})});
addEventListener("resize",function(){sparks.width=innerWidth;sparks.height=innerHeight;apply()});

/* ---------- sparkles around Zain (display only) ---------- */
var sc=sparks.getContext("2d"),dots=[];
sparks.width=innerWidth;sparks.height=innerHeight;
function tick(){
  step();
  sc.clearRect(0,0,sparks.width,sparks.height);
  if(sparkOn&&$("intro").style.display==="none"){
    if(dots.length<26&&Math.random()<.35){
      var h=baseH()*S.s,a=Math.random()*Math.PI*2,rr=Math.random();
      dots.push({x:S.x+Math.cos(a)*h*.55*rr,y:S.y-h*.5+Math.sin(a)*h*.5*rr,vy:-.15-Math.random()*.35,l:0,m:70+Math.random()*60,z:1.5+Math.random()*2.5});
    }
    for(var i=dots.length-1;i>=0;i--){var d=dots[i];d.l++;d.y+=d.vy;d.x+=(d.vx||0);
      var t=d.l/d.m;if(t>=1){dots.splice(i,1);continue}
      var al=Math.sin(t*Math.PI);sc.globalAlpha=al*.9;sc.fillStyle=i%2?"#fff6c9":"#ffd0e6";
      sc.beginPath();sc.moveTo(d.x,d.y-d.z*2);sc.lineTo(d.x+d.z*.6,d.y-d.z*.6);sc.lineTo(d.x+d.z*2,d.y);sc.lineTo(d.x+d.z*.6,d.y+d.z*.6);
      sc.lineTo(d.x,d.y+d.z*2);sc.lineTo(d.x-d.z*.6,d.y+d.z*.6);sc.lineTo(d.x-d.z*2,d.y);sc.lineTo(d.x-d.z*.6,d.y-d.z*.6);sc.closePath();sc.fill()}
    sc.globalAlpha=1}
  requestAnimationFrame(tick)}
requestAnimationFrame(tick);

/* ---------- take picture ---------- */
var lastBlob=null;
function coverDraw(ctx,el,w,h,mirror){
  var sw=el.videoWidth||el.naturalWidth,sh=el.videoHeight||el.naturalHeight;if(!sw||!sh)return;
  var k=Math.max(w/sw,h/sh),dw=sw*k,dh=sh*k,dx=(w-dw)/2,dy=(h-dh)/2;
  ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(el,dx,dy,dw,dh);ctx.restore()}
$("bSnap").onclick=function(){
  var dpr=Math.min(2,devicePixelRatio||1),W=Math.round(innerWidth*dpr),H=Math.round(innerHeight*dpr);
  var c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
  var g0=x.createRadialGradient(W/2,H*.2,10,W/2,H*.2,H);g0.addColorStop(0,"#4a2b5c");g0.addColorStop(1,"#1b1020");x.fillStyle=g0;x.fillRect(0,0,W,H);
  if(mode==="cam")coverDraw(x,cam,W,H,mirrorBg);else if(mode==="photo")coverDraw(x,bgimg,W,H,false);
  var h=baseH()*S.s*depth()*dpr,w=h*AR;
  x.save();x.translate(S.x*dpr,S.y*dpr);
  var sg=x.createRadialGradient(0,0,2,0,0,w*.3);sg.addColorStop(0,"rgba(0,0,0,.38)");sg.addColorStop(1,"rgba(0,0,0,0)");
  x.save();x.scale(1,.16);x.fillStyle=sg;x.beginPath();x.arc(0,0,w*.3,0,7);x.fill();x.restore();
  x.rotate(S.r*Math.PI/180);x.scale(flip*V.sx,1);drawZain(x,w,h,dpr);x.restore();
  var f=$("flash");f.style.opacity=.85;setTimeout(function(){f.style.opacity=0},90);
  c.toBlob(function(b){if(!b){tip("Couldn’t make the picture",2500);return}
    lastBlob=b;var u=URL.createObjectURL(b);$("shotImg").src=u;$("shot").style.display="flex"},"image/png");
};
$("bClose").onclick=function(){$("shot").style.display="none"};
$("bSave").onclick=function(){
  if(!lastBlob)return;var name="Zain-AR-"+Date.now()+".png";
  var file=null;try{file=new File([lastBlob],name,{type:"image/png"})}catch(_){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:"Zain"}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(lastBlob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove()},500);tip("Saved to your downloads",2500)};
document.addEventListener("visibilitychange",function(){if(!document.hidden&&mode==="cam"&&cam.paused)cam.play().catch(function(){})});
apply();
})();
</script>
